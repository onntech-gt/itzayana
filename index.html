<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyería Itzayana</title>
    <!-- Tailwind CSS para diseño elegante y rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #ffffff; color: #000000; }
        h1 { font-family: 'Cinzel', serif; }
        .border-teal-custom { border: 1px solid #008080; }
        .btn-whatsapp { background-color: #25D366; color: white; border-radius: 9999px; }
    </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col items-center p-4">

    <!-- Encabezado -->
    <header class="w-full text-center py-6 border-b border-gray-100">
        <h1 class="text-3xl md:text-5xl tracking-widest uppercase font-bold text-black">Joyería Itzayana</h1>
    </header>

    <!-- Navegación por Categorías (Pestañas) -->
    <nav class="w-full max-w-md my-6 overflow-x-auto">
        <div class="flex justify-start md:justify-center space-x-2 border-b pb-2 px-2 text-sm">
            <button onclick="filtrarCategoria('Todos')" class="tab-btn px-3 py-1 font-semibold border-b-2 border-black">Todos</button>
            <button onclick="filtrarCategoria('Anillo')" class="tab-btn px-3 py-1 text-gray-500">Anillos</button>
            <button onclick="filtrarCategoria('Argolla')" class="tab-btn px-3 py-1 text-gray-500">Argollas</button>
            <button onclick="filtrarCategoria('Collar')" class="tab-btn px-3 py-1 text-gray-500">Collares</button>
            <button onclick="filtrarCategoria('Dije')" class="tab-btn px-3 py-1 text-gray-500">Dijes</button>
            <button onclick="filtrarCategoria('Pendiente')" class="tab-btn px-3 py-1 text-gray-500">Pendientes</button>
            <button onclick="filtrarCategoria('Pulcera')" class="tab-btn px-3 py-1 text-gray-500">Pulceras</button>
            <button onclick="filtrarCategoria('Rosario')" class="tab-btn px-3 py-1 text-gray-500">Rosarios</button>
        </div>
    </nav>

    <!-- Catálogo de Productos (2 Columnas) -->
    <main class="w-full max-w-md md:max-w-2xl">
        <div id="catalogo" class="grid grid-cols-2 gap-4">
            <p class="col-span-2 text-center text-gray-400 py-10">Cargando catálogo...</p>
        </div>
    </main>

    <!-- Botón General de WhatsApp al final de la página -->
    <footer class="w-full max-w-md text-center my-10">
        <a id="btn-wa-general" href="#" target="_blank" class="inline-block w-full py-3 px-6 btn-whatsapp font-bold shadow-md hover:bg-green-600 transition">
            Contactar por WhatsApp
        </a>
    </footer>

    <!-- Modal para agrandar la imagen -->
    <div id="modal-img" class="fixed inset-0 bg-black bg-opacity-80 hidden flex items-center justify-center p-4 z-50" onclick="cerrarModal()">
        <img id="img-ampliada" src="" class="max-w-full max-h-full rounded shadow-lg">
    </div>

    <script>
        // CONFIGURACIÓN: Reemplaza estos dos datos
        const SHEET_ID = 'https://docs.google.com/spreadsheets/d/1bCrq5U4ei-hVUoadJQ4OTU0NEDj9RiaaidghomxT3_o/edit?gid=0#gid=0'; 
        const NUMERO_WHATSAPP = '502XXXXXXXX'; // Número con código de país (ej. 50212345678)

        let productosGlobales = [];

        // Asignar WhatsApp General
        document.getElementById('btn-wa-general').href = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent('Hola, Quisiera más información sobre su catálogo.')}`;

        // Obtener datos mediante la API pública de Google Sheets (OpenSheet)
        async function cargarCatalogo() {
            try {
                const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/Hoja 1`);
                const data = await res.json();
                
                // Filtrar solo los disponibles
                productosGlobales = data.filter(item => item.DISPONIBILIDAD && item.DISPONIBILIDAD.trim().toLowerCase() === 'disponible');
                renderizarProductos(productosGlobales);
            } catch (error) {
                console.error(error);
                document.getElementById('catalogo').innerHTML = '<p class="col-span-2 text-center text-red-500">Error al cargar el catálogo.</p>';
            }
        }

        function renderizarProductos(productos) {
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = '';

            if (productos.length === 0) {
                contenedor.innerHTML = '<p class="col-span-2 text-center text-gray-500">No hay piezas disponibles en esta categoría.</p>';
                return;
            }

            productos.forEach(prod => {
                const linkWA = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(`Quiero hacer un pedido del producto ID: ${prod.ID}`)}`;
                
                const card = document.createElement('div');
                card.className = "flex flex-col justify-between p-3 border-teal-custom bg-white text-center rounded-sm shadow-sm";

                card.innerHTML = `
                    <div>
                        <div class="w-full h-44 overflow-hidden mb-2 cursor-pointer bg-gray-50 flex items-center justify-center" onclick="agrandarImagen('${prod.IMAGEN}')">
                            <img src="${prod.IMAGEN}" alt="${prod.PIEZA}" class="object-cover w-full h-full hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/150?text=Sin+Imagen'">
                        </div>
                        <p class="text-xs text-gray-700 font-light mb-2 line-clamp-3">${prod.DESCRIPCION || ''}</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-500 italic mb-1">Incluye costo de envío y empaquetado</p>
                        <p class="text-base font-bold mb-3">Q ${prod.PRECIO}</p>
                        <a href="${linkWA}" target="_blank" class="inline-block w-full py-2 px-2 text-xs font-semibold btn-whatsapp shadow hover:opacity-90 transition">
                            Haga su pedido
                        </a>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function filtrarCategoria(cat) {
            // Actualizar pestañas activas
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => {
                b.classList.remove('font-semibold', 'border-b-2', 'border-black');
                b.classList.add('text-gray-500');
                if (b.innerText.toLowerCase().includes(cat.toLowerCase()) || (cat === 'Todos' && b.innerText === 'Todos')) {
                    b.classList.add('font-semibold', 'border-b-2', 'border-black');
                    b.classList.remove('text-gray-500');
                }
            });

            if (cat === 'Todos') {
                renderizarProductos(productosGlobales);
            } else {
                const filtrados = productosGlobales.filter(p => p.PIEZA && p.PIEZA.toLowerCase().includes(cat.toLowerCase()));
                renderizarProductos(filtrados);
            }
        }

        function agrandarImagen(url) {
            document.getElementById('img-ampliada').src = url;
            document.getElementById('modal-img').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-img').classList.add('hidden');
        }

        // Cargar al iniciar
        cargarCatalogo();
    </script>
</body>
</html>
